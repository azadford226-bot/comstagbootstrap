# Test environment configuration
spring.application.name=comestag-test

# Use H2 in-memory database for tests
# INIT creates the Postgres custom enum types (account_type/account_status) as H2 domains
# so Hibernate's create-drop can build the schema without the real Postgres/Flyway migrations.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS account_type AS VARCHAR\\;CREATE DOMAIN IF NOT EXISTS account_status AS VARCHAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests (using ddl-auto=create-drop instead)
spring.flyway.enabled=false

# Run data.sql (reference data) after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Test JWT configuration
auth.token.user.secret_key=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMTIzNDU2Nzg5MA==
auth.token.access.duration=1800
auth.token.refresh.duration=18000
verification_code.secret=test-verification-secret
verification_code.algo=HmacSHA256

# Email configuration (mock)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=testpass
mail.from=test@comestag.com
mail.fromName=Comestag Test

# Disable SendGrid for tests
sendgrid.apiKey=test-key

# Test URLs
url.base=http://localhost:8080
url.verification-code.verify=${url.base}/v1/auth/email-verify
url.email.restore=${url.base}/v1/auth/restore-email
url.org.my-profile=${url.base}/v1/profile

# CORS - allow all for tests
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Disable rate limiting for tests
app.rate-limit.enabled=false

# Disable live DNS MX record verification during tests (offline/deterministic)
email-check.mx-check-enabled=false

# Media storage directories (satisfy @Value placeholders; storage is a no-op in tests)
media.dire.base=${java.io.tmpdir}/comestag-test-media
media.dire.profile=profile
media.dire.success-story=success_story
media.dire.certificate=certificate
media.dire.post=post
media.dire.event=event

# Logging
logging.level.root=ERROR
logging.level.com.hivecontrolsolutions.comestag=DEBUG
logging.level.org.springframework.test=INFO
