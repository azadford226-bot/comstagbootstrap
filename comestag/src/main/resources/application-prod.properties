# Production Environment Configuration
# All sensitive values MUST be provided via environment variables
# DO NOT hardcode any secrets, passwords, or API keys in this file

# Application URLs
url.base=${APP_BASE_URL:https://localhost:3000}
url.verification-code.verify=${url.base}/v1/auth/email-verify
url.email.restore=${url.base}/v1/auth/restore-email
url.org.my-profile=${url.base}/v1/profile

# Database Configuration
# Accepts SPRING_DATASOURCE_PASSWORD or DB_PASSWORD (Railway uses DB_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Security Configuration
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:}
app.security.jwt-exp-minutes=${APP_SECURITY_JWT_EXP_MINUTES:60}

# Stripe subscription billing: set all three secrets in the deployment platform.
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.price-id=${STRIPE_PRICE_ID:}
billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
billing.stripe.app-base-url=${APP_BASE_URL:https://www.comstag.com}

# Verification Code Configuration
verification_code.secret=${VERIFICATION_CODE_SECRET:${APP_SECURITY_JWT_SECRET}}
verification_code.algo=HmacSHA256

# Auth Token Configuration
auth.token.refresh.duration=${AUTH_TOKEN_REFRESH_DURATION:864000}
auth.token.access.duration=${AUTH_TOKEN_ACCESS_DURATION:1800}
auth.token.user.secret_key=${AUTH_TOKEN_USER_SECRET_KEY:${APP_SECURITY_JWT_SECRET:}}

# Email Configuration (Zoho is primary; SMTP settings are optional fallback)
spring.mail.host=${MAIL_HOST:smtp.zoho.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${ZOHO_MAIL_EMAIL:}}
spring.mail.password=${MAIL_PASSWORD:${ZOHO_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SendGrid Configuration (optional)
sendgrid.apiKey=${SENDGRID_API_KEY:}
mail.from=${MAIL_FROM:}
mail.fromName=${MAIL_FROM_NAME:Comestag}
mail.contact=${MAIL_CONTACT:info@comstag.com}

# Media Configuration
app.media.max-attachments-per-post=10
app.media.max-file-bytes=104857600
app.media.allowed-kinds=[IMAGE, VIDEO, DOC]

# Supabase Configuration (optional - falls back to local storage if not set)
supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
supabase.serviceKey=${SUPABASE_SERVICE_KEY:placeholder}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:comestag-media}
supabase.storage.public-base-url=${supabase.url}/storage/v1/object/public

# Logging Configuration - Production appropriate levels
logging.level.root=WARN
logging.level.com.hivecontrolsolutions.comestag=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
reactor.netty.http.server.accessLogEnabled=false

# Management/Actuator Configuration - Production safe
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:false}
spring.reactor.context-propagation=auto
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING:0.1}
# Only expose safe endpoints - no env, loggers, or trace
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# CORS Configuration - MUST be set for production domain(s)
# Set CORS_ALLOWED_ORIGINS environment variable with comma-separated list
# Example: CORS_ALLOWED_ORIGINS=https://app.comestag.com,https://www.comestag.com
# WARNING: If not set, application will fail to start in production profile
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-methods[0]=GET
app.cors.allowed-methods[1]=POST
app.cors.allowed-methods[2]=PUT
app.cors.allowed-methods[3]=DELETE
app.cors.allowed-methods[4]=PATCH
app.cors.allowed-methods[5]=OPTIONS
app.cors.allowed-headers[0]=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Rate Limiting Configuration
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.refill-tokens=${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
app.rate-limit.login.refill-duration-minutes=${RATE_LIMIT_LOGIN_REFILL_DURATION:15}
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:3}
app.rate-limit.register.refill-tokens=${RATE_LIMIT_REGISTER_REFILL_TOKENS:3}
app.rate-limit.register.refill-duration-minutes=${RATE_LIMIT_REGISTER_REFILL_DURATION:60}
app.rate-limit.api.capacity=${RATE_LIMIT_API_CAPACITY:100}
app.rate-limit.api.refill-tokens=${RATE_LIMIT_API_REFILL_TOKENS:100}
app.rate-limit.api.refill-duration-minutes=${RATE_LIMIT_API_REFILL_DURATION:1}

# JSON Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Account Configuration
account.email.change-log.expiry=604800

# Email Domain Blocking (inherited from application.properties)
# Blocked domains list is in main application.properties
