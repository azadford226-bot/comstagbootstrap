app.media.max-attachments-per-post=10
# 100 MB
app.media.max-file-bytes=104857600
app.media.allowed-kinds=[IMAGE, VIDEO, DOC]
#============= Logging ===========
logging.level.root=INFO
logging.level.com.acme.sensors=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.server.reactive=INFO
logging.level.reactor.netty=INFO
# Reactor Netty access log (per HTTP request line)
reactor.netty.http.server.accessLogEnabled=true
management.tracing.enabled=true
spring.reactor.context-propagation=auto
# Trace sampling: sample a fraction of requests in production to limit overhead/cost.
# Override with TRACING_SAMPLE_PROBABILITY (1.0 = all requests, 0.1 = 10%).
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
# Safe default actuator exposure (debug endpoints should be profile-specific)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# Disable mail health check (we use Zoho Mail SMTP, not Spring Mail)
management.health.mail.enabled=false
# comment out if you don?t have an OTLP collector running
#otel.exporter.otlp.endpoint=http://localhost:4317
#otel.exporter.otlp.protocol=grpc
## or HTTP: http://localhost:4318 and protocol=http/protobuf
#============= JSON ===========
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
verification_code.secret=${VERIFICATION_CODE_SECRET:}
verification_code.algo=HmacSHA256
auth.token.refresh.duration=${AUTH_TOKEN_REFRESH_DURATION:18000}
auth.token.access.duration=${AUTH_TOKEN_ACCESS_DURATION:1800}
auth.token.user.secret_key=${AUTH_TOKEN_USER_SECRET_KEY:${APP_SECURITY_JWT_SECRET:}}
# Comma-separated emails that skip the login email OTP (test/QA accounts). Empty = disabled.
auth.otp-bypass-emails=${AUTH_OTP_BYPASS_EMAILS:}
#=============== Email ================#
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#============== Account Configs ===============#
account.email.change-log.expiry=604800

#============== OAuth2 (Google / GitHub) ===============#
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

#============== CORS Configuration ===============#
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

#============== Rate Limiting Configuration ===============#
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.refill-tokens=${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
app.rate-limit.login.refill-duration-minutes=${RATE_LIMIT_LOGIN_REFILL_DURATION:15}
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:3}
app.rate-limit.register.refill-tokens=${RATE_LIMIT_REGISTER_REFILL_TOKENS:3}
app.rate-limit.register.refill-duration-minutes=${RATE_LIMIT_REGISTER_REFILL_DURATION:60}
app.rate-limit.api.capacity=${RATE_LIMIT_API_CAPACITY:100}
app.rate-limit.api.refill-tokens=${RATE_LIMIT_API_REFILL_TOKENS:100}
app.rate-limit.api.refill-duration-minutes=${RATE_LIMIT_API_REFILL_DURATION:1}

#============== Email Services ===============#
# Zoho Mail (preferred) - Set ZOHO_MAIL_EMAIL and ZOHO_MAIL_PASSWORD to use Zoho
zoho.mail.email=${ZOHO_MAIL_EMAIL:}
zoho.mail.password=${ZOHO_MAIL_PASSWORD:}
# Resend (alternative) - Set RESEND_API_KEY to use Resend
resend.apiKey=${RESEND_API_KEY:}
# SendGrid (alternative) - Set SENDGRID_API_KEY to use SendGrid
sendgrid.apiKey=${SENDGRID_API_KEY:}
# Common email settings
mail.from=${MAIL_FROM:}
mail.fromName=${MAIL_FROM_NAME:Comestag}

#============== File Storage ===============#
# Provider used in stag/prod: "supabase" (default) or "s3".
# "s3" works with DigitalOcean Spaces, AWS S3 and Cloudflare R2.
storage.provider=${STORAGE_PROVIDER:supabase}

# --- Supabase Storage (when storage.provider=supabase) ---
supabase.url=${SUPABASE_URL:}
supabase.serviceKey=${SUPABASE_SERVICE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:comestag-media}
supabase.storage.public-base-url=${SUPABASE_PUBLIC_BASE_URL:${supabase.url}/storage/v1/object/public}

# --- S3-compatible storage (when storage.provider=s3) ---
# endpoint: DigitalOcean Spaces e.g. https://nyc3.digitaloceanspaces.com
#           Cloudflare R2 e.g. https://<accountid>.r2.cloudflarestorage.com
#           Leave blank for real AWS S3.
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.access-key=${S3_ACCESS_KEY:}
storage.s3.secret-key=${S3_SECRET_KEY:}
storage.s3.bucket=${S3_BUCKET:comestag-media}
storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
# R2 usually needs true; Spaces/AWS use false (virtual-hosted style).
storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}

